<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kom igång - Klarälvskök</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <div id="sidebar-container" class="shrink-0"></div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-4 md:p-6 lg:p-8 w-full max-w-full relative">
        <div class="mb-6">
            <h2 class="text-xl md:text-2xl font-semibold text-gray-800">Kom igång</h2>
            <p class="text-xs md:text-sm text-gray-500 mt-1">Checklista över grundläggande konfiguration - bra att gå igenom vid en ny installation.</p>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-gray-200 max-w-2xl">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <span class="text-sm font-medium text-gray-700">Färdigt</span>
                <span id="progressText" class="text-sm font-bold text-gray-800">0 / 0</span>
            </div>
            <div class="h-2 bg-gray-100">
                <div id="progressBar" class="h-2 bg-green-500 transition-all" style="width: 0%"></div>
            </div>
            <ul id="checklist" class="divide-y divide-gray-100"></ul>
        </div>
    </main>

    <script src="/common.js"></script>
    <script src="/menu.js"></script>
    <script>
        const CHECKLIST_ITEMS = [
            { key: 'company_name', label: 'Företagsnamn ifyllt', href: '/settings.html', hint: 'Visas i menyn, på offerter och köpeavtal.' },
            { key: 'logo', label: 'Logotyp uppladdad', href: '/settings.html', hint: 'Visas i sidomenyn och överst på PDF-dokument.' },
            { key: 'vat_rate', label: 'Momssats inställd', href: '/settings.html', hint: 'Styr alla automatiska prisuträkningar (Faktor-fälten m.m.).' },
            { key: 'agreement_text', label: 'Köpevillkor/avtalstext ifylld', href: '/settings.html', hint: 'Visas på köpeavtalet vid signering.' },
            { key: 'suppliers', label: 'Minst en leverantör upplagd', href: '/suppliers.html', hint: 'Behövs för att koppla inköpspriser/påslag till produkter.' },
            { key: 'products', label: 'Minst en produkt i produktregistret', href: '/products.html', hint: 'Utan produkter går det inte att bygga offerter.' },
            { key: 'door_models', label: 'Minst en dörrmodell upplagd', href: '/door-models.html', hint: 'Behövs för att kunna lägga till luckor/lådfronter i offerter.' },
            { key: 'extra_users', label: 'Minst en ytterligare användare skapad', href: '/users.html', hint: 'Så att säljare/montörer kan logga in med egna konton.' }
        ];

        async function loadStatus() {
            try {
                const res = await fetch('/api/onboarding-status');
                if (!res.ok) { document.getElementById('checklist').innerHTML = '<li class="p-4 text-sm text-gray-500">Endast administratörer kan se den här sidan.</li>'; return; }
                const status = await res.json();
                render(status);
            } catch (e) { console.error(e); }
        }

        function render(status) {
            const list = document.getElementById('checklist');
            list.innerHTML = '';
            let done = 0;
            CHECKLIST_ITEMS.forEach(item => {
                const ok = !!status[item.key];
                if (ok) done++;
                const icon = ok
                    ? '<i class="fas fa-circle-check text-green-500 text-lg"></i>'
                    : '<i class="fas fa-circle text-gray-300 text-lg"></i>';
                list.innerHTML += `
                    <li class="p-4 flex items-center gap-3 ${ok ? '' : 'hover:bg-gray-50'}">
                        <div class="shrink-0">${icon}</div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-medium ${ok ? 'text-gray-500 line-through' : 'text-gray-800'}">${item.label}</p>
                            <p class="text-xs text-gray-400 mt-0.5">${item.hint}</p>
                        </div>
                        ${ok ? '' : `<a href="${item.href}" class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-1.5 rounded transition">Ordna</a>`}
                    </li>
                `;
            });
            document.getElementById('progressText').innerText = `${done} / ${CHECKLIST_ITEMS.length}`;
            document.getElementById('progressBar').style.width = `${Math.round((done / CHECKLIST_ITEMS.length) * 100)}%`;
        }

        loadStatus();
    </script>
</body>
</html>
