<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritningsmoduler - Klarälvskök</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-4 lg:p-6">
        <div class="mb-6 lg:pl-0 pl-12">
            <h2 class="text-2xl font-semibold text-gray-800">Ritningsmoduler</h2>
            <p class="text-sm text-gray-500 mt-1">Modulbiblioteket som visas i offertbyggarens rityta (t.ex. trelådshurts, skåp med lucka, passbit). Koppla en modul till en produkt så blir den automatiskt en prissatt offertrad när den läggs ut i ritningen.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="bg-white p-5 rounded-lg shadow-sm h-fit">
                <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">Moduler</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newModuleName" placeholder="Namn, t.ex. Skåp med lucka 60" class="flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm">
                    <button onclick="addModule()" class="bg-blue-600 text-white px-3 rounded text-sm hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                </div>
                <div id="moduleList" class="space-y-1"></div>
            </div>

            <div class="lg:col-span-3 bg-white p-5 rounded-lg shadow-sm">
                <div id="noModuleSelected" class="text-gray-400 italic text-sm py-10 text-center">Välj eller skapa en modul till vänster för att redigera den.</div>

                <div id="moduleDetail" class="hidden">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <input type="text" id="mDetailName" class="text-lg font-bold text-gray-800 border border-transparent hover:border-gray-300 focus:border-blue-500 rounded px-2 py-1 -ml-2 outline-none">
                        <button onclick="deleteModule()" class="text-red-600 hover:text-red-900 text-sm"><i class="fas fa-trash mr-1"></i> Ta bort modul</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Form (används i ritningen)</label>
                            <select id="mShape" onchange="toggleDrawerCountField()" class="w-full px-3 py-2 border border-gray-300 rounded text-sm bg-white">
                                <option value="door">Skåp med lucka</option>
                                <option value="drawers">Skåp med lådor</option>
                                <option value="filler">Passbit</option>
                                <option value="corner">Hörnskåp</option>
                                <option value="open">Öppen hylla</option>
                                <option value="other">Övrigt</option>
                            </select>
                        </div>
                        <div id="mDrawerCountWrap" class="hidden">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Antal lådor (t.ex. 3 för en trelådshurts)</label>
                            <input type="number" id="mDrawerCount" min="1" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-700 mb-1">Kopplad produkt (styr priset i offerten)</label>
                            <select id="mProductId" class="w-full px-3 py-2 border border-gray-300 rounded text-sm bg-white">
                                <option value="">-- Ingen (endast visuell, inget pris) --</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-5">
                        <label class="block text-xs font-bold text-gray-700 mb-2 uppercase tracking-wide">Standardmått (mm) - kan justeras per placering i ritningen</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Tjocklek stomme</label>
                                <input type="number" id="mFrameThickness" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Invändig bredd</label>
                                <input type="number" id="mWidthInternal" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Utvändig bredd</label>
                                <input type="number" id="mWidthExternal" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Djup</label>
                                <input type="number" id="mDepth" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Invändigt djup</label>
                                <input type="number" id="mDepthInternal" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Invändig höjd</label>
                                <input type="number" id="mHeightInternal" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] text-gray-500 mb-1">Utvändig höjd</label>
                                <input type="number" id="mHeightExternal" class="w-full px-2 py-1.5 border border-gray-300 rounded text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2 mt-5">
                        <button onclick="saveModule()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-blue-700">Spara ändringar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/common.js"></script>
    <script src="/menu.js"></script>
    <script>
        let allModules = []; let allProducts = []; let currentModuleId = null;

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                allProducts = await res.json();
                const sel = document.getElementById('mProductId');
                sel.innerHTML = '<option value="">-- Ingen (endast visuell, inget pris) --</option>';
                allProducts.forEach(p => { sel.innerHTML += `<option value="${p.id}">${escapeHtml(p.name)}</option>`; });
            } catch (e) { console.error(e); }
        }

        async function fetchModules() {
            const res = await fetch('/api/drawing-modules');
            allModules = await res.json();
            renderModuleList();
        }

        function renderModuleList() {
            const div = document.getElementById('moduleList');
            div.innerHTML = '';
            if (allModules.length === 0) { div.innerHTML = '<p class="text-xs text-gray-400 italic">Inga moduler ännu.</p>'; return; }
            allModules.forEach(m => {
                const active = m.id === currentModuleId;
                div.innerHTML += `<button onclick="selectModule(${m.id})" class="w-full text-left px-3 py-2 rounded text-sm ${active ? 'bg-blue-100 text-blue-800 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">${escapeHtml(m.name)}</button>`;
            });
        }

        async function addModule() {
            const name = document.getElementById('newModuleName').value.trim();
            if (!name) return;
            const res = await fetch('/api/drawing-modules', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
            const data = await res.json();
            if (!res.ok) { alert(data.message || `Något gick fel (status ${res.status}).`); return; }
            document.getElementById('newModuleName').value = '';
            await fetchModules();
            if (data.id) selectModule(data.id);
        }

        function selectModule(id) {
            currentModuleId = id;
            renderModuleList();
            document.getElementById('noModuleSelected').classList.add('hidden');
            document.getElementById('moduleDetail').classList.remove('hidden');
            const m = allModules.find(x => x.id === id) || {};
            document.getElementById('mDetailName').value = m.name || '';
            document.getElementById('mShape').value = m.shape || 'door';
            document.getElementById('mDrawerCount').value = m.drawer_count ?? '';
            toggleDrawerCountField();
            document.getElementById('mProductId').value = m.product_id || '';
            document.getElementById('mFrameThickness').value = m.frame_thickness ?? '';
            document.getElementById('mWidthInternal').value = m.width_internal ?? '';
            document.getElementById('mWidthExternal').value = m.width_external ?? '';
            document.getElementById('mDepth').value = m.depth ?? '';
            document.getElementById('mDepthInternal').value = m.depth_internal ?? '';
            document.getElementById('mHeightInternal').value = m.height_internal ?? '';
            document.getElementById('mHeightExternal').value = m.height_external ?? '';
        }

        function toggleDrawerCountField() {
            document.getElementById('mDrawerCountWrap').classList.toggle('hidden', document.getElementById('mShape').value !== 'drawers');
        }

        function deleteModule() {
            if (!currentModuleId) return;
            confirmAndDelete('Inaktivera denna modul? Den försvinner då från modulbiblioteket i ritningen. Redan placerade instanser i sparade offerter påverkas inte.', `/api/drawing-modules/${currentModuleId}`, () => {
                currentModuleId = null;
                document.getElementById('moduleDetail').classList.add('hidden');
                document.getElementById('noModuleSelected').classList.remove('hidden');
                fetchModules();
            });
        }

        async function saveModule() {
            if (!currentModuleId) return;
            const name = document.getElementById('mDetailName').value.trim();
            if (!name) return alert('Namn saknas.');
            const body = {
                name,
                shape: document.getElementById('mShape').value,
                drawer_count: document.getElementById('mDrawerCount').value || null,
                product_id: document.getElementById('mProductId').value || null,
                frame_thickness: document.getElementById('mFrameThickness').value || null,
                width_internal: document.getElementById('mWidthInternal').value || null,
                width_external: document.getElementById('mWidthExternal').value || null,
                depth: document.getElementById('mDepth').value || null,
                depth_internal: document.getElementById('mDepthInternal').value || null,
                height_internal: document.getElementById('mHeightInternal').value || null,
                height_external: document.getElementById('mHeightExternal').value || null,
                active: true
            };
            const res = await fetch(`/api/drawing-modules/${currentModuleId}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await res.json();
            alert(data.message || 'Sparad!');
            fetchModules();
        }

        fetchProducts();
        fetchModules();
    </script>
</body>
</html>
