<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stomtyper - Klarälvskök</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-6">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Stomtyper</h2>
            <p class="text-sm text-gray-500 mt-1">Återanvändbara frontberäkningar för skåpstommar. Produkter refererar till en stomtyp - redigerar du beräkningen här slår det igenom på alla produkter som använder den.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="bg-white p-5 rounded-lg shadow-sm h-fit">
                <h3 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">Stomtyper</h3>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newTypeName" placeholder="Namn, t.ex. 3 lådor 60cm" class="flex-1 px-2 py-1.5 border border-gray-300 rounded text-sm">
                    <button onclick="addFrameType()" class="bg-blue-600 text-white px-3 rounded text-sm hover:bg-blue-700"><i class="fas fa-plus"></i></button>
                </div>
                <div id="typeList" class="space-y-1"></div>
            </div>

            <div class="lg:col-span-3 bg-white p-5 rounded-lg shadow-sm">
                <div id="noTypeSelected" class="text-gray-400 italic text-sm py-10 text-center">Välj eller skapa en stomtyp till vänster för att redigera dess beräkning.</div>

                <div id="typeDetail" class="hidden">
                    <div class="flex justify-between items-center mb-4 border-b pb-3">
                        <input type="text" id="typeDetailName" class="text-lg font-bold text-gray-800 border border-transparent hover:border-gray-300 focus:border-blue-500 rounded px-2 py-1 -ml-2 outline-none">
                        <button onclick="deleteFrameType()" class="text-red-600 hover:text-red-900 text-sm"><i class="fas fa-trash mr-1"></i> Ta bort stomtyp</button>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 rounded p-4">
                        <label class="block text-xs font-medium text-gray-700">Frontkonfiguration</label>
                        <select id="tFrontType" onchange="toggleCustomFrontUI()" class="mt-1 w-full px-3 py-2 border border-gray-300 rounded text-sm bg-white">
                            <option value="">Ingen (tomt skåp / hanteras manuellt)</option>
                            <option value="door">Lucka (1 st, höjd stomme-6, bredd stomme-4)</option>
                            <option value="drawers2">2 lådfronter (lika höga)</option>
                            <option value="drawers3">3 lådfronter (135 / 273 / rest)</option>
                            <option value="drawers4">4 lådfronter (135x3 / rest)</option>
                            <option value="drawers5">5 lådfronter (135x4 / rest)</option>
                            <option value="fixed135_1">1 fast lådfront (135mm)</option>
                            <option value="fixed135_2">2 fasta lådfronter (135mm vardera)</option>
                            <option value="custom">Anpassad (ange manuellt nedan)</option>
                        </select>
                        <div id="customFrontWrap" class="hidden mt-2">
                            <label class="block text-xs font-medium text-gray-700">Anpassade fronter (JSON-array)</label>
                            <textarea id="tFrontCustomJson" rows="2" placeholder='[{&quot;height&quot;:379},{&quot;height&quot;:576}]' class="mt-1 w-full px-3 py-2 border border-gray-300 rounded text-xs font-mono"></textarea>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <button onclick="saveFrameType()" class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-blue-700">Spara ändringar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allTypes = [];
        let currentTypeId = null;

        async function fetchFrameTypes() {
            const res = await fetch('/api/frame-types');
            allTypes = await res.json();
            renderTypeList();
        }

        function renderTypeList() {
            const div = document.getElementById('typeList');
            div.innerHTML = '';
            if (allTypes.length === 0) { div.innerHTML = '<p class="text-xs text-gray-400 italic">Inga stomtyper ännu.</p>'; return; }
            allTypes.forEach(t => {
                const active = t.id === currentTypeId;
                div.innerHTML += `<button onclick="selectFrameType(${t.id})" class="w-full text-left px-3 py-2 rounded text-sm ${active ? 'bg-blue-100 text-blue-800 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">${t.name}</button>`;
            });
        }

        async function addFrameType() {
            const name = document.getElementById('newTypeName').value.trim();
            if (!name) return;
            const res = await fetch('/api/frame-types', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, front_layout: JSON.stringify({ type: '' }) }) });
            const data = await res.json();
            document.getElementById('newTypeName').value = '';
            await fetchFrameTypes();
            if (data.id) selectFrameType(data.id);
        }

        function selectFrameType(id) {
            currentTypeId = id;
            renderTypeList();
            document.getElementById('noTypeSelected').classList.add('hidden');
            document.getElementById('typeDetail').classList.remove('hidden');
            const t = allTypes.find(x => x.id === id);
            document.getElementById('typeDetailName').value = t ? t.name : '';
            loadFrontLayoutIntoForm(t ? t.front_layout : null);
        }

        async function deleteFrameType() {
            if (!currentTypeId) return;
            if (!confirm('Inaktivera denna stomtyp? Produkter som använder den behåller sin senaste beräkning men typen visas inte längre i listorna. Detta går att återställa manuellt i databasen om det behövs.')) return;
            await fetch(`/api/frame-types/${currentTypeId}`, { method: 'DELETE' });
            currentTypeId = null;
            document.getElementById('typeDetail').classList.add('hidden');
            document.getElementById('noTypeSelected').classList.remove('hidden');
            fetchFrameTypes();
        }

        function toggleCustomFrontUI() {
            const type = document.getElementById('tFrontType').value;
            document.getElementById('customFrontWrap').classList.toggle('hidden', type !== 'custom');
        }

        function buildFrontLayoutJson() {
            const type = document.getElementById('tFrontType').value;
            if (!type) return JSON.stringify({ type: '' });
            if (type === 'door') return JSON.stringify({ type: 'door' });
            if (type === 'drawers2') return JSON.stringify({ type: 'drawers', count: 2 });
            if (type === 'drawers3') return JSON.stringify({ type: 'drawers', count: 3 });
            if (type === 'drawers4') return JSON.stringify({ type: 'drawers', count: 4 });
            if (type === 'drawers5') return JSON.stringify({ type: 'drawers', count: 5 });
            if (type === 'fixed135_1') return JSON.stringify({ type: 'fixed135', count: 1 });
            if (type === 'fixed135_2') return JSON.stringify({ type: 'fixed135', count: 2 });
            if (type === 'custom') {
                try {
                    const fronts = JSON.parse(document.getElementById('tFrontCustomJson').value || '[]');
                    return JSON.stringify({ type: 'custom', fronts });
                } catch (e) { alert('Ogiltig JSON i "Anpassade fronter" - kontrollera formatet.'); return null; }
            }
            return JSON.stringify({ type: '' });
        }

        function loadFrontLayoutIntoForm(frontLayoutRaw) {
            document.getElementById('tFrontType').value = '';
            document.getElementById('tFrontCustomJson').value = '';
            if (!frontLayoutRaw) { toggleCustomFrontUI(); return; }
            try {
                const fl = JSON.parse(frontLayoutRaw);
                if (fl.type === 'door') document.getElementById('tFrontType').value = 'door';
                else if (fl.type === 'drawers') document.getElementById('tFrontType').value = 'drawers' + fl.count;
                else if (fl.type === 'fixed135') document.getElementById('tFrontType').value = 'fixed135_' + fl.count;
                else if (fl.type === 'custom') { document.getElementById('tFrontType').value = 'custom'; document.getElementById('tFrontCustomJson').value = JSON.stringify(fl.fronts || []); }
            } catch (e) {}
            toggleCustomFrontUI();
        }

        async function saveFrameType() {
            if (!currentTypeId) return;
            const frontLayoutJson = buildFrontLayoutJson();
            if (frontLayoutJson === null) return; // ogiltig anpassad JSON, avbryt sparning
            const name = document.getElementById('typeDetailName').value.trim();
            if (!name) return alert('Namn saknas.');
            const res = await fetch(`/api/frame-types/${currentTypeId}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, front_layout: frontLayoutJson, active: true })
            });
            const data = await res.json();
            alert(data.message || 'Sparad!');
            fetchFrameTypes();
        }

        fetchFrameTypes();
    </script>
    <script src="/menu.js"></script>
</body>
</html>
