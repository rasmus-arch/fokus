<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Användarhantering - Klarälvskök</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

 <div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Hantera Användare (Superadmin)</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm h-fit">
                <h3 class="text-lg font-medium text-gray-700 mb-4">Skapa ny användare</h3>
                <form id="userForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Namn</label>
                        <input type="text" id="userName" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">E-post</label>
                        <input type="email" id="userEmail" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Lösenord</label>
                        <input type="password" id="userPassword" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Roll</label>
                        <select id="userRole" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
                            <option value="Superadmin">Superadmin</option>
                            <option value="Admin">Admin</option>
                            <option value="Säljare">Säljare</option>
                            <option value="Montör">Montör</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md font-medium hover:bg-blue-700">Spara användare</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm lg:col-span-2 overflow-x-auto">
                <h3 class="text-lg font-medium text-gray-700 mb-4">Befintliga användare</h3>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 bg-gray-50 text-gray-600 text-sm font-medium">
                            <th class="p-3">Namn</th>
                            <th class="p-3">E-post</th>
                            <th class="p-3">Roll</th>
                            <th class="p-3">Åtgärd</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="text-gray-700 text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Hämta och visa alla användare när sidan laddas
        async function fetchUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="p-3 font-medium">${user.name}</td>
                        <td class="p-3">${user.email}</td>
                        <td class="p-3"><span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800 font-semibold">${user.role}</span></td>
                        <td class="p-3">
                            <button onclick="deleteUser(${user.id})" class="text-red-600 hover:text-red-900"><i class="fas fa-trash"></i> Ta bort</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Skapa ny användare
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const role = document.getElementById('userRole').value;

            const res = await fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });

            const data = await res.json();
            alert(data.message);
            if (res.ok) {
                document.getElementById('userForm').reset();
                fetchUsers();
            }
        });

        // Ta bort användare
        async function deleteUser(id) {
            if (confirm('Är du säker på att du vill ta bort denna användare?')) {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();
                alert(data.message);
                fetchUsers();
            }
        }

        // Kör vid sidladdning
        fetchUsers();
    </script>
    <script src="/menu.js"></script>
</body>
</html>
