<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Din offert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <div id="loadingState" class="bg-white rounded-lg shadow-sm p-10 text-center text-gray-400">
            <i class="fas fa-circle-notch fa-spin text-2xl mb-3"></i>
            <p>Laddar offert...</p>
        </div>

        <div id="errorState" class="hidden bg-white rounded-lg shadow-sm p-10 text-center">
            <i class="fas fa-triangle-exclamation text-3xl text-amber-500 mb-3"></i>
            <p id="errorMessage" class="text-gray-600"></p>
        </div>

        <div id="offerContent" class="hidden space-y-4">
            <div class="bg-white rounded-lg shadow-sm p-6 md:p-8 text-center border-t-4" id="headerCard">
                <img id="companyLogo" class="h-12 mx-auto mb-3 object-contain hidden">
                <h2 id="companyName" class="text-lg font-semibold text-gray-700"></h2>
                <h1 id="quoteTitle" class="text-2xl font-bold text-gray-900 mt-2">Din offert</h1>
                <p id="customerLine" class="text-sm text-gray-500 mt-1"></p>
            </div>

            <div id="publicCommentBox" class="hidden bg-blue-50 border border-blue-100 rounded-lg p-4 text-sm text-gray-700 whitespace-pre-line"></div>

            <div id="imageGalleryBox" class="hidden bg-white rounded-lg shadow-sm p-6 md:p-8">
                <h3 class="font-semibold text-gray-800 mb-4">Bilder</h3>
                <div id="imageGallery" class="grid grid-cols-3 sm:grid-cols-4 gap-3"></div>
            </div>

            <div class="bg-white rounded-lg shadow-sm p-6 md:p-8">
                <h3 class="font-semibold text-gray-800 mb-4">Innehåll</h3>
                <ul id="itemsList" class="divide-y divide-gray-100"></ul>
            </div>

            <div class="bg-white rounded-lg shadow-sm p-6 md:p-8">
                <h3 class="font-semibold text-gray-800 mb-4">Sammanställning</h3>
                <div id="totalsBox" class="space-y-1.5 text-sm"></div>
            </div>

            <div class="bg-white rounded-lg shadow-sm p-6 md:p-8 text-center">
                <a id="pdfLink" href="#" target="_blank" class="inline-flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-700 px-5 py-2.5 rounded-md text-sm font-medium transition">
                    <i class="fas fa-file-pdf mr-2 text-red-400"></i> Visa som PDF
                </a>
            </div>

            <div id="responseCard" class="bg-white rounded-lg shadow-sm p-6 md:p-8"></div>
        </div>
    </div>

    <div id="lightbox" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4" onclick="closeLightbox(event)">
        <button onclick="closeLightbox(event)" class="absolute top-4 right-4 text-white text-3xl leading-none w-10 h-10 flex items-center justify-center hover:text-gray-300">&times;</button>
        <img id="lightboxImg" class="max-w-full max-h-full object-contain rounded" src="">
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token');
        let offerData = null;

        function krText(s) { return s; }

        async function loadOffer() {
            if (!token) return showError('Ingen länk angiven.');
            try {
                const res = await fetch(`/api/public/offer/${token}`);
                const data = await res.json();
                if (!res.ok) return showError(data.message || 'Kunde inte ladda offerten.');
                offerData = data;
                render(data);
            } catch (e) {
                showError('Kunde inte ansluta till servern. Kontrollera din internetanslutning och försök igen.');
            }
        }

        function showError(msg) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('errorMessage').innerText = msg;
            document.getElementById('errorState').classList.remove('hidden');
        }

        function render(data) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('offerContent').classList.remove('hidden');

            document.getElementById('headerCard').style.borderColor = data.company.color_primary;
            if (data.company.logo_url) {
                const img = document.getElementById('companyLogo');
                img.src = data.company.logo_url;
                img.classList.remove('hidden');
            } else {
                document.getElementById('companyName').innerText = data.company.name;
            }
            document.getElementById('quoteTitle').innerText = data.order_number ? `Order #${data.order_number}` : 'Din offert';
            document.getElementById('customerLine').innerText = `${data.quote_name} · ${data.customer_name}`;

            if (data.public_comment) {
                const box = document.getElementById('publicCommentBox');
                box.innerText = data.public_comment;
                box.classList.remove('hidden');
            }

            const list = document.getElementById('itemsList');
            list.innerHTML = data.items.length === 0
                ? '<li class="py-3 text-sm text-gray-400 italic">Inga rader att visa.</li>'
                : data.items.map(i => `
                    <li class="py-3 flex items-center gap-3">
                        ${i.imageUrl ? `<img src="${i.imageUrl}" class="w-12 h-12 object-cover rounded border border-gray-200 shrink-0">` : '<div class="w-12 h-12 rounded bg-gray-50 border border-gray-200 shrink-0 flex items-center justify-center text-gray-300"><i class="fas fa-image"></i></div>'}
                        <div class="min-w-0 flex-1">
                            <p class="text-sm font-medium text-gray-800 truncate">${i.name}</p>
                            <p class="text-xs text-gray-400">${i.qty} st</p>
                        </div>
                    </li>
                `).join('');

            const t = data.totals;
            const totalsBox = document.getElementById('totalsBox');
            let rows = `
                <div class="flex justify-between text-gray-500"><span>Produktkostnad innan rabatt</span><span>${t.material_full_price}</span></div>
                <div class="flex justify-between text-gray-500"><span>Rabatt</span><span>- ${t.discount}</span></div>
                <div class="flex justify-between text-gray-700 font-medium border-t pt-1.5 mt-1"><span>Summa produktkostnad</span><span>${t.material_inc_vat}</span></div>`;
            if (t.non_rot_services !== '0 kr') rows += `<div class="flex justify-between text-gray-500"><span>Tjänster, ej ROT</span><span>${t.non_rot_services}</span></div>`;
            rows += `<div class="flex justify-between text-gray-500"><span>Monteringskostnad</span><span>${t.rot_eligible_install}</span></div>`;
            if (t.rot_deduction) rows += `<div class="flex justify-between text-green-600 font-medium"><span>ROT-avdrag (30%)</span><span>- ${t.rot_deduction}</span></div>`;
            rows += `<div class="flex justify-between text-lg font-bold text-gray-900 border-t pt-2 mt-2"><span>Att betala</span><span>${t.final_to_pay}</span></div>`;
            totalsBox.innerHTML = rows;

            document.getElementById('pdfLink').href = `/api/public/offer/${token}/pdf`;

            if (data.images && data.images.length > 0) {
                document.getElementById('imageGalleryBox').classList.remove('hidden');
                document.getElementById('imageGallery').innerHTML = data.images.map((img, idx) => `
                    <button onclick="openLightbox(${idx})" class="aspect-square rounded overflow-hidden border border-gray-200 hover:opacity-80 transition">
                        <img src="${img.url}" alt="${img.name || ''}" class="w-full h-full object-cover">
                    </button>
                `).join('');
            }

            renderResponseCard(data);
        }

        function openLightbox(idx) {
            document.getElementById('lightboxImg').src = offerData.images[idx].url;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox(e) {
            if (e) e.stopPropagation();
            document.getElementById('lightbox').classList.add('hidden');
        }

        function renderResponseCard(data) {
            const card = document.getElementById('responseCard');
            if (data.customer_response === 'accepted') {
                card.innerHTML = `<div class="text-center text-green-700"><i class="fas fa-circle-check text-3xl mb-2"></i><p class="font-semibold">Du godkände den här offerten</p><p class="text-xs text-gray-400 mt-1">${new Date(data.customer_response_at).toLocaleString('sv-SE')}</p></div>`;
                return;
            }
            if (data.customer_response === 'declined') {
                card.innerHTML = `<div class="text-center text-gray-600"><i class="fas fa-circle-xmark text-3xl mb-2 text-gray-400"></i><p class="font-semibold">Du avböjde den här offerten</p><p class="text-xs text-gray-400 mt-1">${new Date(data.customer_response_at).toLocaleString('sv-SE')}</p></div>`;
                return;
            }
            if (!data.can_respond) {
                card.innerHTML = `<p class="text-center text-sm text-gray-400 italic">Den här offerten går inte längre att svara på via länken.</p>`;
                return;
            }
            card.innerHTML = `
                <div id="decisionButtons" class="flex flex-col sm:flex-row gap-3">
                    <button onclick="startAccept()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-md transition flex items-center justify-center"><i class="fas fa-check mr-2"></i> Godkänn offert</button>
                    <button onclick="startDecline()" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 font-medium py-3 rounded-md transition flex items-center justify-center"><i class="fas fa-times mr-2"></i> Avböj offert</button>
                </div>
                <div id="confirmArea" class="mt-4"></div>
            `;
        }

        function startAccept() {
            document.getElementById('decisionButtons').classList.add('opacity-40', 'pointer-events-none');
            const termsText = (offerData.terms_text || '').trim();
            if (!termsText) { showAcceptForm(); return; }
            document.getElementById('confirmArea').innerHTML = `
                <div class="bg-white border border-gray-200 rounded-md p-4">
                    <h4 class="text-sm font-semibold text-gray-700 mb-2">Köpvillkor</h4>
                    <div id="termsScrollBox" class="h-56 overflow-y-auto border border-gray-200 rounded p-3 text-xs text-gray-600 bg-gray-50 whitespace-pre-line">${termsText}</div>
                    <p id="termsScrollHint" class="text-xs text-amber-600 mt-2"><i class="fas fa-arrow-down mr-1"></i> Scrolla ner för att läsa igenom hela texten.</p>
                    <div class="flex gap-2 mt-3">
                        <button id="termsContinueBtn" disabled onclick="showAcceptForm()" class="bg-gray-300 text-white font-medium px-4 py-2 rounded-md text-sm transition cursor-not-allowed">Jag har läst igenom villkoren - Fortsätt</button>
                        <button onclick="renderResponseCard(offerData)" class="text-gray-500 text-sm px-3">Avbryt</button>
                    </div>
                </div>
            `;
            const box = document.getElementById('termsScrollBox');
            box.addEventListener('scroll', checkTermsScroll);
            checkTermsScroll();
        }

        function checkTermsScroll() {
            const box = document.getElementById('termsScrollBox');
            const btn = document.getElementById('termsContinueBtn');
            if (!box || !btn) return;
            const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
            if (atBottom) {
                btn.disabled = false;
                btn.className = 'bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md text-sm transition';
                document.getElementById('termsScrollHint').classList.add('hidden');
            }
        }

        function showAcceptForm() {
            document.getElementById('confirmArea').innerHTML = `
                <div class="bg-green-50 border border-green-100 rounded-md p-4 space-y-4">
                    <div>
                        <h4 class="text-sm font-semibold text-gray-700 mb-2">Dina uppgifter</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <input id="accName" type="text" placeholder="Namn *" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500 sm:col-span-2">
                            <input id="accPersonnummer" type="text" placeholder="Personnummer (ÅÅÅÅMMDD-XXXX)" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                            <input id="accEmail" type="email" placeholder="E-post *" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                            <input id="accAddress" type="text" placeholder="Gatuadress" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500 sm:col-span-2">
                            <input id="accAddress2" type="text" placeholder="Gatuadress rad 2" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500 sm:col-span-2">
                            <input id="accApartment" type="text" placeholder="Lägenhetsnummer" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                            <input id="accPhone" type="text" placeholder="Telefonnummer" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                            <input id="accBrfOrgNr" type="text" placeholder="BRF:s org.nr" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                            <input id="accPropertyDesignation" type="text" placeholder="Fastighetsbeteckning" class="border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-green-500">
                        </div>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-700 mb-2">Foto på giltig legitimation *</h4>
                        <p class="text-xs text-gray-500 mb-2">Sparas säkert och tas bara fram om det skulle uppstå en tvist om godkännandet.</p>
                        <input id="accIdPhoto" type="file" accept="image/*" capture="environment" class="text-sm">
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-700 mb-2">Signera med finger/mus *</h4>
                        <canvas id="sigCanvas" class="w-full h-40 bg-white border border-gray-300 rounded" style="touch-action:none;"></canvas>
                        <button type="button" onclick="clearSignature()" class="text-xs text-gray-500 mt-1 underline">Rensa signatur</button>
                    </div>
                    <label class="flex items-start gap-2 text-sm text-gray-700 cursor-pointer">
                        <input type="checkbox" id="acceptCheckbox" class="mt-0.5 w-4 h-4 rounded border-gray-300 text-green-600">
                        Jag har läst igenom offerten ovan och bekräftar att mina uppgifter, foto och signatur är korrekta.
                    </label>
                    <div class="flex gap-2">
                        <button onclick="confirmAccept()" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-md text-sm transition">Bekräfta godkännande</button>
                        <button onclick="renderResponseCard(offerData)" class="text-gray-500 text-sm px-3">Avbryt</button>
                    </div>
                    <p id="acceptError" class="hidden text-xs text-red-500"></p>
                </div>
            `;
            const c = offerData.customer || {};
            document.getElementById('accName').value = c.name || '';
            document.getElementById('accPersonnummer').value = c.personnummer || '';
            document.getElementById('accEmail').value = c.email || '';
            document.getElementById('accAddress').value = c.address || '';
            document.getElementById('accAddress2').value = c.address2 || '';
            document.getElementById('accApartment').value = c.apartment_number || '';
            document.getElementById('accPhone').value = c.phone || '';
            document.getElementById('accBrfOrgNr').value = c.brf_org_nr || '';
            document.getElementById('accPropertyDesignation').value = c.property_designation || '';
            initSignaturePad();
        }

        let sigCtx = null, sigHasInk = false, sigDrawing = false;
        function initSignaturePad() {
            const canvas = document.getElementById('sigCanvas');
            const ratio = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * ratio;
            canvas.height = rect.height * ratio;
            sigCtx = canvas.getContext('2d');
            sigCtx.scale(ratio, ratio);
            sigCtx.lineWidth = 2;
            sigCtx.lineCap = 'round';
            sigCtx.strokeStyle = '#1f2937';
            sigHasInk = false;

            const pos = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
            canvas.addEventListener('pointerdown', e => {
                sigDrawing = true;
                const p = pos(e);
                sigCtx.beginPath();
                sigCtx.moveTo(p.x, p.y);
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', e => {
                if (!sigDrawing) return;
                const p = pos(e);
                sigCtx.lineTo(p.x, p.y);
                sigCtx.stroke();
                sigHasInk = true;
            });
            canvas.addEventListener('pointerup', () => sigDrawing = false);
            canvas.addEventListener('pointerleave', () => sigDrawing = false);
        }

        function clearSignature() {
            const canvas = document.getElementById('sigCanvas');
            sigCtx.clearRect(0, 0, canvas.width, canvas.height);
            sigHasInk = false;
        }

        function showAcceptError(msg) {
            const err = document.getElementById('acceptError');
            err.innerText = msg;
            err.classList.remove('hidden');
        }

        function startDecline() {
            document.getElementById('decisionButtons').classList.add('opacity-40', 'pointer-events-none');
            document.getElementById('confirmArea').innerHTML = `
                <div class="bg-gray-50 border border-gray-200 rounded-md p-4">
                    <label class="block text-xs text-gray-500 uppercase font-semibold mb-1">Anledning (valfritt)</label>
                    <textarea id="declineReason" rows="2" class="w-full border border-gray-300 rounded px-2 py-1.5 text-sm outline-none focus:border-gray-500"></textarea>
                    <div class="flex gap-2 mt-3">
                        <button onclick="confirmDecline()" class="bg-gray-700 hover:bg-gray-800 text-white font-medium px-4 py-2 rounded-md text-sm transition">Bekräfta avböjande</button>
                        <button onclick="renderResponseCard(offerData)" class="text-gray-500 text-sm px-3">Avbryt</button>
                    </div>
                    <p id="declineError" class="hidden text-xs text-red-500 mt-2"></p>
                </div>
            `;
        }

        async function confirmAccept() {
            const name = document.getElementById('accName').value.trim();
            const email = document.getElementById('accEmail').value.trim();
            const idPhotoInput = document.getElementById('accIdPhoto');

            if (!name) return showAcceptError('Fyll i ditt namn.');
            if (!email) return showAcceptError('Fyll i din e-postadress.');
            if (!idPhotoInput.files || idPhotoInput.files.length === 0) return showAcceptError('Ladda upp/ta ett foto på din legitimation.');
            if (!sigHasInk) return showAcceptError('Signera i rutan ovan innan du bekräftar.');
            if (!document.getElementById('acceptCheckbox').checked) return showAcceptError('Kryssa i rutan för att bekräfta.');

            const canvas = document.getElementById('sigCanvas');
            const formData = new FormData();
            formData.append('name', name);
            formData.append('email', email);
            formData.append('personnummer', document.getElementById('accPersonnummer').value.trim());
            formData.append('address', document.getElementById('accAddress').value.trim());
            formData.append('address2', document.getElementById('accAddress2').value.trim());
            formData.append('apartment_number', document.getElementById('accApartment').value.trim());
            formData.append('phone', document.getElementById('accPhone').value.trim());
            formData.append('brf_org_nr', document.getElementById('accBrfOrgNr').value.trim());
            formData.append('property_designation', document.getElementById('accPropertyDesignation').value.trim());
            formData.append('signature', canvas.toDataURL('image/png'));
            formData.append('id_photo', idPhotoInput.files[0]);

            try {
                const res = await fetch(`/api/public/offer/${token}/accept`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) return showAcceptError(data.message);
                offerData.customer_response = 'accepted';
                offerData.customer_response_at = new Date().toISOString();
                renderResponseCard(offerData);
            } catch (e) { showAcceptError('Kunde inte skicka ditt godkännande. Försök igen.'); }
        }

        async function confirmDecline() {
            try {
                const res = await fetch(`/api/public/offer/${token}/decline`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: document.getElementById('declineReason').value }) });
                const data = await res.json();
                if (!res.ok) { const err = document.getElementById('declineError'); err.innerText = data.message; err.classList.remove('hidden'); return; }
                offerData.customer_response = 'declined';
                offerData.customer_response_at = new Date().toISOString();
                renderResponseCard(offerData);
            } catch (e) { alert('Kunde inte skicka ditt svar. Försök igen.'); }
        }

        loadOffer();
    </script>
</body>
</html>
