<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik - Klarälvskök</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">
<div id="sidebar-container"></div>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-6">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">Affärsstatistik & Analys</h2>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h3 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-folder text-blue-500 mr-2"></i> Kategori-nivå</h3>
                <p class="text-xs text-gray-400 mb-4">Visar antal unika produkter per kategori i systemet just nu.</p>
                <div id="categoryStats" class="space-y-3">
                    </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h3 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-star text-yellow-500 mr-2"></i> Toppresterande Produkter</h3>
                <p class="text-xs text-gray-400 mb-4">Mest sålda artiklar totalt i offerter.</p>
                <div id="productStats" class="space-y-3">
                    </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm">
                <h3 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-user-tie text-purple-500 mr-2"></i> Säljarliga</h3>
                <p class="text-xs text-gray-400 mb-4">Försäljningsresultat och win-rate per säljare.</p>
                <div id="salesStats" class="space-y-3">
                    </div>
            </div>

        </div>
    </main>

    <script>
        async function loadStats() {
            const res = await fetch('/api/statistics');
            const data = await res.json();

            // 1. Rendera kategorier
            const catDiv = document.getElementById('categoryStats');
            catDiv.innerHTML = '';
            data.categories.forEach(c => {
                catDiv.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-100">
                        <span class="font-medium text-gray-800">${c.category || 'Ospecificerad'}</span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold">${c.count} st artiklar</span>
                    </div>
                `;
            });

            // 2. Rendera produkter
            const prodDiv = document.getElementById('productStats');
            prodDiv.innerHTML = '';
            data.products.forEach(p => {
                prodDiv.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded border border-gray-100 flex justify-between items-center">
                        <div>
                            <span class="font-medium text-gray-800 block">${p.name}</span>
                            <span class="text-xs text-gray-500">${p.sales} sålda enheter</span>
                        </div>
                        <span class="font-bold text-gray-700">${p.revenue.toLocaleString()} kr</span>
                    </div>
                `;
            });

            // 3. Rendera säljare
            const salesDiv = document.getElementById('salesStats');
            salesDiv.innerHTML = '';
            data.salespeople.forEach(s => {
                salesDiv.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded border border-gray-100 space-y-1">
                        <div class="flex justify-between font-medium text-gray-800">
                            <span>${s.name}</span>
                            <span class="text-green-600">${s.revenue.toLocaleString()} kr</span>
                        </div>
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>Offert-avslut: ${s.closed}/${s.quotes}</span>
                            <span class="font-semibold text-blue-600">Win-rate: ${s.closed ? Math.round((s.closed/s.quotes)*100) : 0}%</span>
                        </div>
                    </div>
                `;
            });
        }
        loadStats();
    </script>
    <script src="/menu.js"></script>
</body>
</html>
